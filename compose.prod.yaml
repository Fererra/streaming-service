services:
  server:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - '${APP_PORT:-80}:3000'
    environment:
      NODE_ENV: production
    env_file:
      - .env.production.local
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
