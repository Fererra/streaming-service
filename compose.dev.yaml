services:
  server:
    build:
      context: .
      target: development
    volumes:
      - ./src:/usr/src/app/src
    environment:
      NODE_ENV: development
    env_file:
      - .env.development.local
    networks:
      - backend
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: streaming-service-dev
    networks:
      - backend
    expose:
      - 5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
networks:
  backend:
    driver: bridge
