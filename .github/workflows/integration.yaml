name: Integration tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: Test environment

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Start Database
        run: docker compose -f compose.test.yaml --profile integration up -d --wait

      - name: Create .env file
        run: echo "${{ secrets.TEST_ENV_BUNDLE }}" > .env.test.local

      - name: Run Integration Tests
        run: npx jest --config ./test/jest-integration.json --runInBand
        env:
          NODE_ENV: test

      - name: Stop and Clean up
        if: always()
        run: docker compose -f compose.test.yaml down -v
